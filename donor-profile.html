```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Donor Profile - BloodConnect</title>

    <link rel="stylesheet" href="../style.css">

    <script src="../database.js"></script>

    <style>

        .profile-container {
            max-width: 750px;
            margin: 40px auto;
        }

        .profile-card {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);

            border-top: 6px solid #b71c1c;
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            background: #fbe9e7;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 45px;
        }

        .profile-header h1 {
            color: #b71c1c;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #666;
        }

        .profile-details {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .detail-box {
            background: #f8f8f8;

            padding: 15px;

            border-radius: 8px;
        }

        .detail-box strong {
            display: block;

            color: #555;

            font-size: 14px;

            margin-bottom: 5px;
        }

        .detail-box span {
            font-size: 17px;
            font-weight: 500;
        }

        .blood-group {
            color: #b71c1c;

            font-size: 25px !important;

            font-weight: bold !important;
        }

        .available {
            color: #155724;

            background: #d4edda;

            padding: 6px 12px;

            border-radius: 15px;

            display: inline-block;
        }

        .not-available {
            color: #721c24;

            background: #f8d7da;

            padding: 6px 12px;

            border-radius: 15px;

            display: inline-block;
        }

        .profile-actions {
            text-align: center;

            margin-top: 30px;

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-block;

            padding: 11px 20px;

            border-radius: 6px;

            text-decoration: none;

            background: #b71c1c;

            color: white;
        }

        .action-btn:hover {
            background: #8e0000;
        }

        .secondary-btn {
            background: #666;
        }

        .secondary-btn:hover {
            background: #444;
        }

        .error-box {
            background: #f8d7da;

            color: #721c24;

            padding: 20px;

            border-radius: 8px;

            text-align: center;
        }

        @media (max-width: 600px) {

            .profile-details {
                grid-template-columns: 1fr;
            }

            .profile-card {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            🩸 BloodConnect
        </div>


        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="find-donor.html">
                Find Donor
            </a>

            <a href="donor-dashboard.html">
                Dashboard
            </a>

            <a href="blood-availability.html">
                Availability
            </a>

            <a href="emergency-request.html">
                Emergency
            </a>

            <a href="admin-dashboard.html">
                Admin
            </a>

        </div>

    </nav>

</header>


<section class="page active">

    <div class="container profile-container">

        <div id="profileArea">

            <p>
                Loading donor profile...
            </p>

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 BloodConnect |
        Online Blood Donor Registration Portal
    </p>

</footer>



<script>


// Get donor ID from URL
function getDonorId() {

    const parameters =
        new URLSearchParams(
            window.location.search
        );

    return Number(
        parameters.get("id")
    );

}


// Load donor
async function loadDonorProfile() {

    const donorId =
        getDonorId();


    const profileArea =
        document.getElementById(
            "profileArea"
        );


    if (!donorId) {

        showError(
            "No donor was selected."
        );

        return;

    }


    const donors =
        await getAllDonors();


    const donor =
        donors.find(function(item) {

            return item.id === donorId;

        });


    if (!donor) {

        showError(
            "Donor profile could not be found."
        );

        return;

    }


    displayProfile(donor);

}


// Display profile
function displayProfile(donor) {

    const profileArea =
        document.getElementById(
            "profileArea"
        );


    let availabilityHTML;


    if (
        donor.availability ===
        "Available"
    ) {

        availabilityHTML = `

            <span class="available">
                Available
            </span>

        `;

    } else {

        availabilityHTML = `

            <span class="not-available">
                Not Available
            </span>

        `;

    }


    profileArea.innerHTML = `

        <div class="profile-card">


            <div class="profile-header">

                <div class="profile-icon">
                    🩸
                </div>

                <h1>
                    ${escapeHTML(donor.name)}
                </h1>

                <p>
                    Blood Donor Profile
                </p>

            </div>


            <div class="profile-details">


                <div class="detail-box">

                    <strong>
                        Blood Group
                    </strong>

                    <span class="blood-group">
                        ${escapeHTML(
                            donor.bloodGroup
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Availability
                    </strong>

                    <span>
                        ${availabilityHTML}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Full Name
                    </strong>

                    <span>
                        ${escapeHTML(
                            donor.name
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Age
                    </strong>

                    <span>
                        ${donor.age}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Location
                    </strong>

                    <span>
                        ${escapeHTML(
                            donor.location
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Phone Number
                    </strong>

                    <span>
                        ${escapeHTML(
                            donor.phone
                        )}
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Last Donation Date
                    </strong>

                    <span>
                        ${
                            donor.lastDonation
                            ? escapeHTML(
                                donor.lastDonation
                            )
                            : "Not provided"
                        }
                    </span>

                </div>


                <div class="detail-box">

                    <strong>
                        Registered On
                    </strong>

                    <span>
                        ${
                            donor.registeredDate
                            ? escapeHTML(
                                donor.registeredDate
                            )
                            : "Not available"
                        }
                    </span>

                </div>


            </div>


            <div class="profile-actions">

                <a
                    href="edit-donor.html"
                    class="action-btn"
                >
                    Edit Donor
                </a>


                <a
                    href="advanced-search.html"
                    class="action-btn secondary-btn"
                >
                    Back to Search
                </a>

            </div>


        </div>

    `;

}


// Show error
function showError(message) {

    document.getElementById(
        "profileArea"
    ).innerHTML = `

        <div class="error-box">

            <h2>
                Donor Not Found
            </h2>

            <p>
                ${escapeHTML(message)}
            </p>

            <br>

            <a
                href="advanced-search.html"
                class="action-btn"
            >
                Return to Donor Search
            </a>

        </div>

    `;

}


// Prevent HTML injection
function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// Start
document.addEventListener(
    "DOMContentLoaded",
    loadDonorProfile
);

</script>


</body>

</html>
```
