<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Donor - BloodConnect</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <div class="logo">🩸 BloodConnect</div>

        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="find-donor.html">Find Donor</a>
            <a href="eligibility.html">Eligibility</a>
        </div>
    </nav>
</header>

<main>

<section class="page active">

    <div class="container">

        <h2>Become a Blood Donor</h2>

        <p class="section-description">
            Register your details to become a potential blood donor.
        </p>

        <form id="donorForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="two-columns">

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        min="18"
                        max="65"
                        placeholder="Enter your age"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="bloodGroup">Blood Group</label>

                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>

                <input
                    type="tel"
                    id="phone"
                    maxlength="10"
                    placeholder="Enter 10-digit phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="location">Location</label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter your city/location"
                    required
                >
            </div>

            <div class="form-group">
                <label for="lastDonation">
                    Last Donation Date
                </label>

                <input
                    type="date"
                    id="lastDonation"
                >
            </div>

            <div class="form-group">
                <label for="availability">
                    Availability
                </label>

                <select id="availability" required>
                    <option value="">Select Availability</option>
                    <option value="Available">Available</option>
                    <option value="Not Available">Not Available</option>
                </select>
            </div>

            <button type="submit" class="primary-btn">
                Register as Donor
            </button>

            <div id="formMessage"></div>

        </form>

    </div>

</section>

</main>

<footer>
    <p>
        © 2026 BloodConnect | Online Blood Donor Registration Portal
    </p>
</footer>

<script src="../database.js"></script>
<script src="../app.js"></script>

</body>
</html>
