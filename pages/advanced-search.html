<script src="../database.js"></script>
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Advanced Donor Search - BloodConnect</title>

    <link rel="stylesheet" href="../style.css">

    <script src="../database.js"></script>

    <style>

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .filter-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-btn {
            background: #b71c1c;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .search-btn:hover {
            background: #8e0000;
        }

        .reset-btn {
            background: #666;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .result-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .advanced-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid #b71c1c;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .advanced-card h3 {
            margin-top: 0;
            color: #b71c1c;
        }

        .available-label {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background: #d4edda;
            color: #155724;
            font-size: 13px;
            font-weight: bold;
        }

        .unavailable-label {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 15px;
            background: #f8d7da;
            color: #721c24;
            font-size: 13px;
            font-weight: bold;
        }

        .empty-message {
            background: #fff3cd;
            padding: 18px;
            border-radius: 8px;
        }

    </style>

</head>


<body>


<header>

    <nav class="navbar">

        <div class="logo">
            🩸 BloodConnect
        </div>

        <div class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

            <a href="find-donor.html">
                Find Donor
            </a>

            <a href="donor-dashboard.html">
                Dashboard
            </a>

            <a href="blood-availability.html">
                Availability
            </a>

            <a href="emergency-request.html">
                Emergency
            </a>

            <a href="admin-dashboard.html">
                Admin
            </a>

        </div>

    </nav>

</header>


<section class="page active">

    <div class="container">

        <h1>
            Advanced Donor Search
        </h1>

        <p>
            Find suitable blood donors using multiple filters.
        </p>


        <div class="search-box">

            <div class="filter-grid">


                <div class="form-group">

                    <label for="bloodGroup">
                        Blood Group
                    </label>

                    <select id="bloodGroup">

                        <option value="">
                            All Blood Groups
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter location"
                    >

                </div>


                <div class="form-group">

                    <label for="availability">
                        Availability
                    </label>

                    <select id="availability">

                        <option value="">
                            All
                        </option>

                        <option value="Available">
                            Available
                        </option>

                        <option value="Not Available">
                            Not Available
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="sortBy">
                        Sort By
                    </label>

                    <select id="sortBy">

                        <option value="availability">
                            Availability
                        </option>

                        <option value="name">
                            Name
                        </option>

                        <option value="bloodGroup">
                            Blood Group
                        </option>

                        <option value="location">
                            Location
                        </option>

                    </select>

                </div>

            </div>


            <div class="filter-buttons">

                <button
                    class="search-btn"
                    onclick="searchDonors()"
                >
                    🔍 Search Donors
                </button>


                <button
                    class="reset-btn"
                    onclick="resetSearch()"
                >
                    Reset
                </button>

            </div>

        </div>


        <div
            id="resultInfo"
            class="result-info"
        >
            Showing all registered donors.
        </div>


        <div id="results">

            Loading donors...

        </div>

    </div>

</section>


<footer>

    <p>
        © 2026 BloodConnect |
        Online Blood Donor Registration Portal
    </p>

</footer>



<script>


let allDonors = [];


// Load donors
async function loadDonors() {

    allDonors =
        await getAllDonors();

    displayResults(allDonors);

}


// Search
function searchDonors() {

    const bloodGroup =
        document
        .getElementById("bloodGroup")
        .value;


    const location =
        document
        .getElementById("location")
        .value
        .trim()
        .toLowerCase();


    const availability =
        document
        .getElementById("availability")
        .value;


    const sortBy =
        document
        .getElementById("sortBy")
        .value;


    let filtered =
        allDonors.filter(function(donor) {


            const bloodMatch =
                !bloodGroup ||
                donor.bloodGroup === bloodGroup;


            const donorLocation =
                (donor.location || "")
                .toLowerCase();


            const locationMatch =
                !location ||
                donorLocation.includes(location);


            const availabilityMatch =
                !availability ||
                donor.availability === availability;


            return (
                bloodMatch &&
                locationMatch &&
                availabilityMatch
            );

        });


    // Sorting
    filtered.sort(function(a, b) {


        if (sortBy === "availability") {

            if (
                a.availability === "Available" &&
                b.availability !== "Available"
            ) {
                return -1;
            }

            if (
                a.availability !== "Available" &&
                b.availability === "Available"
            ) {
                return 1;
            }

            return a.name.localeCompare(b.name);

        }


        if (sortBy === "name") {

            return a.name.localeCompare(b.name);

        }


        if (sortBy === "bloodGroup") {

            return a.bloodGroup.localeCompare(
                b.bloodGroup
            );

        }


        if (sortBy === "location") {

            return a.location.localeCompare(
                b.location
            );

        }


        return 0;

    });


    displayResults(filtered);

}


// Display results
function displayResults(donors) {

    const container =
        document.getElementById(
            "results"
        );


    const info =
        document.getElementById(
            "resultInfo"
        );


    info.textContent =
        "Found " +
        donors.length +
        " donor(s).";


    container.innerHTML = "";


    if (donors.length === 0) {

        container.innerHTML = `

            <div class="empty-message">

                <strong>
                    No donors found.
                </strong>

                <p>
                    Try changing your search filters.
                </p>

            </div>

        `;

        return;

    }


    donors.forEach(function(donor) {


        const card =
            document.createElement("div");


        card.className =
            "advanced-card";


        let statusHTML;


        if (
            donor.availability === "Available"
        ) {

            statusHTML = `
                <span class="available-label">
                    Available
                </span>
            `;

        } else {

            statusHTML = `
                <span class="unavailable-label">
                    Not Available
                </span>
            `;

        }


        

           card.innerHTML = `

    <h3>
        🩸 ${escapeHTML(donor.name)}
    </h3>

    <p>
        <strong>Blood Group:</strong>
        ${escapeHTML(donor.bloodGroup)}
    </p>

    <p>
        <strong>Age:</strong>
        ${donor.age}
    </p>

    <p>
        <strong>Location:</strong>
        ${escapeHTML(donor.location)}
    </p>

    <p>
        <strong>Phone:</strong>
        ${escapeHTML(donor.phone)}
    </p>

    <p>
        <strong>Last Donation:</strong>
        ${
            donor.lastDonation
            ? escapeHTML(donor.lastDonation)
            : "Not provided"
        }
    </p>

    <p>
        <strong>Status:</strong>
        ${statusHTML}
    </p>

    <button
        class="search-btn"
        onclick="viewDonorProfile(${donor.id})"
    >
        View Profile
    </button>

`;
      


        container.appendChild(card);

    });

}
// View donor profile
function viewDonorProfile(id) {

    window.location.href =
        "donor-profile.html?id=" + id;

}

// Reset
function resetSearch() {

    document.getElementById(
        "bloodGroup"
    ).value = "";


    document.getElementById(
        "location"
    ).value = "";


    document.getElementById(
        "availability"
    ).value = "";


    document.getElementById(
        "sortBy"
    ).value = "availability";


    displayResults(allDonors);

}


// Escape HTML
function escapeHTML(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value ?? "";


    return div.innerHTML;

}


// Start
document.addEventListener(
    "DOMContentLoaded",
    loadDonors
);

</script>


</body>

</html>
